<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾遗.Gleaner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- 左列：菜单 -->
        <div class="column" id="menu-column">
            <div id="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2.5"/><path d="M8 21h8M12 18v3"/></svg>
                <span>拾遗</span>
            </div>

            <div id="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
                <input type="text" id="search-input" placeholder="搜索屏幕文本">
            </div>

            <nav>
                <div class="nav-group">记录</div>
                <ul id="menu-list">
                    <li class="active" data-type="hourly">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                        时间线
                    </li>
                    <li data-type="daily">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
                        日总结
                    </li>
                    <li data-type="weekly">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
                        周报
                    </li>
                    <li data-type="monthly">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
                        月报
                    </li>

                    <li class="nav-group-item" data-type="storage">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
                        存储
                    </li>
                </ul>
            </nav>

            <div id="status-area"></div>

            <div id="control-area">
                <button id="btn-start">开始采集</button>
                <button id="btn-stop">停止采集</button>
                <button id="btn-analyze" class="secondary">分析上一小时</button>
            </div>
        </div>

        <!-- 中列：时间线 -->
        <div class="column" id="timeline-column">
            <div id="timeline-header">
                <h3>时间线</h3>
                <div id="date-selector"></div>
            </div>
            <div id="timeline-view"></div>
        </div>

        <!-- 右列：AI 总结 -->
        <div class="column" id="content-column">
            <div id="content-header">
                <h3 id="content-title">AI 总结</h3>
            </div>
            <div id="content-view"></div>
            <div id="annotation-area">
                <div id="annotation-display"></div>
                <button id="btn-annotate">编辑标注</button>
            </div>
        </div>
    </div>

    <!-- 标注弹窗 -->
    <div id="annotation-modal" class="modal hidden">
        <div class="modal-content">
            <h3>编辑标注</h3>
            <label>标签 (逗号分隔)</label>
            <input type="text" id="ann-tags">
            <label>备注</label>
            <input type="text" id="ann-note">
            <label>状态</label>
            <select id="ann-status">
                <option value="none">未标记</option>
                <option value="done">已完成</option>
                <option value="todo">待跟进</option>
            </select>
            <div class="modal-buttons">
                <button id="ann-save">保存</button>
                <button id="ann-cancel">取消</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
