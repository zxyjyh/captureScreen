api:
  # 视觉模型：只在无障碍树和 OCR 都抽不出东西时才走这条路
  model: glm-4.6v-flash
  # 文本模型：主路径。用视觉模型处理纯文本既贵又不擅长
  text_model: glm-4-flash
  max_tokens: 4096

capture:
  interval_minutes: 3
  output_dir: screenshots
  retention_days: 7
  # 系统空闲超过这么久就不截图 —— 锁屏、离开工位时的画面没有信息量，只是烧钱
  idle_skip_seconds: 300
  # all: 每块显示器都拍。前台应用只有一个，但副屏上往往开着另一个应用，
  #      那块屏上的东西同样是「当时看得见的」——只拍主屏会整块丢掉。
  # active: 只拍前台窗口所在那块屏，省一半存储。
  displays: all

privacy:
  enabled: true
  skip_keywords:
    - 密码
    - password
    - 1Password
    - Bitwarden
    - LastPass
    - 银行
    - bank
    - 支付宝
    - 微信
    - WeChat
    - 临时会话
    - 隐私
    - incognito

analysis:
  # text: 本地抽文本（无障碍树 + Apple Vision OCR）后只把文字交给模型 —— 零 OCR 成本
  # vision: 直接把图片发给多模态模型 —— 保留作兜底与效果对照
  mode: text

report:
  output_dir: reports

rag:
  enabled: true
  db_path: chroma_db
  embedding_model: embedding-3
  top_k: 20
  max_chars_per_chunk: 300
