api:
  # claude: 走 claude-agent-sdk，透过 Claude Code CLI 用现有订阅鉴权。
  #         不需要单独的 API key，也就没有「余额不足」这回事。
  #         代价是每次调用起一个 CLI 子进程，约 9 秒。
  # zhipu:  走智谱 REST，需要 ZHIPU_API_KEY。
  provider: claude

  # claude 后端留空表示用 CLI 的默认模型
  model: ""
  text_model: ""
  max_tokens: 4096

  # zhipu 后端用
  zhipu_model: glm-4.6v-flash
  zhipu_text_model: glm-4-flash

capture:
  # event: 由事件触发 —— 切换应用、换窗口标题、打字停顿。
  #        固定间隔与实际活动无关：盯着一篇文章看 30 分钟会拍出 10 张
  #        一模一样的，两分钟里切 5 个应用却只拍到 1 个。
  # interval: 固定间隔，保留作对照。
  mode: event

  # 事件模式下的节流。两次采集至少隔 min，最多隔 max。
  min_interval_seconds: 20    # 防止 alt-tab 连按时的采集风暴
  max_interval_seconds: 300   # 兜底：长时间阅读也要留下记录
  poll_seconds: 1             # 轮询四个信号共 0.24 毫秒，可以放心每秒问
  settle_seconds: 0.6         # 切换后等界面渲染完，否则拍到半张空白
  typing_pause_seconds: 3     # 停止打字多久算「一个念头写完了」
  pause_min_interval_seconds: 90  # 「停顿」的节流阈值，比切换高得多：
                                  # 切换是换了上下文（强信号），同窗口内的停顿
                                  # 只是多了几行字（弱信号）。共用 20 秒会让
                                  # 采集频率比固定间隔还高 5 倍

  # 图片存储。这张图只有两个用途：OCR 兜底、人工翻看，都不需要无损。
  # 实测原图 1.46 MB，1600px JPEG q85 只占 5%，OCR 文字保留 98%。
  # 双屏 8 小时：无损 PNG 460 MB/天，压缩后 23 MB/天。
  image:
    format: jpeg      # jpeg | png
    max_width: 1600
    quality: 85

  # interval 模式用
  interval_minutes: 3
  output_dir: screenshots
  retention_days: 7

  # 磁盘紧张时的两道闸。实测图片占 99.9%、文本占 0.1%（文本是图片的 1/841），
  # 所以先砍图片 —— 图片被抽成文本之后，剩下的用途只有人工翻看，
  # 而「上个月那天我在干什么」这种问题，文本答得了。
  #
  # 超过这么多天就删图片，同名的 .txt/.ocr 保留。0 = 不删。
  # 每小时后台补抽多少张图的文本。图片删掉之前必须先抽成文本，
  # 否则「删图片保留文本」就成了「删图片顺便丢内容」。
  # OCR 一张约 1 秒，放后台跑，不占采集主循环。
  ocr_backfill_per_hour: 40

  image_retention_days: 2
  # 整个 screenshots 目录的硬上限（MB）。超了先删最旧的图片，
  # 还不够才删最旧的文本。0 = 不限。
  # 保留期是「多久之前的删掉」，这条是「最多用这么多」——
  # 小硬盘上真正需要的是后者。
  max_disk_mb: 2000
  # 系统空闲超过这么久就不截图 —— 锁屏、离开工位时的画面没有信息量，只是烧钱
  idle_skip_seconds: 300
  # all: 每块显示器都拍。前台应用只有一个，但副屏上往往开着另一个应用，
  #      那块屏上的东西同样是「当时看得见的」——只拍主屏会整块丢掉。
  # active: 只拍前台窗口所在那块屏，省一半存储。
  displays: all

privacy:
  enabled: true

  # 第一层：根本不采集。截图都不会产生 —— 用于任何情况下都不该留痕的东西。
  skip_keywords:
    - 密码
    - password
    - 1Password
    - Bitwarden
    - LastPass
    - 银行
    - bank
    - 支付宝
    - 微信
    - WeChat
    - 临时会话
    - 隐私
    - incognito

  # 第二层：照常采集、本地可搜，但绝不发给模型。
  #
  # 为什么要分两层：一刀切地不采集代价太大 —— 实测钉钉占前台时刻的 20%，
  # 而且隐私检查命中就跳过整次采集，屏 1 是钉钉时屏 2 的代码也一起丢。
  # 但真正的风险不在采集（数据一直在本机），在于把公司内部内容发给第三方模型。
  #
  # 放在这里的应用：截图、无障碍文本、OCR 全部照常落盘，
  # timeline / search_screen 这些纯本地工具照样搜得到（它们不联网），
  # 只是不会进入发往模型的上下文，也就不会出现在报告里。
  # 注意：已经被 skip_keywords 挡掉的（如微信）根本不会采集，写在这里是死配置。
  #
  # 默认把工作 IM 放进来，是因为刚装好时 redact.local.yaml 是空的 ——
  # 那时候放行等于人名、公司名直接出网。等你填好术语表、跑过
  # `python redact.py` 确认没有残留，再把钉钉挪出去，
  # 它的内容就会带着占位符进入报告。
  local_only_apps:
    - 钉钉
    - DingTalk
    - 飞书
    - Lark
    - Slack

analysis:
  # text: 本地抽文本（无障碍树 + Apple Vision OCR）后只把文字交给模型 —— 零 OCR 成本
  # vision: 直接把图片发给多模态模型 —— 保留作兜底与效果对照
  mode: text

  # 一小时最多分析多少帧。事件驱动加多屏之后，活跃的一小时能攒出 50+ 帧，
  # 去重挡不住（不同屏、不同窗口本来就长得不一样），但分析成本不该跟着涨。
  # 超出就均匀抽样，首尾必留。
  max_frames_per_hour: 30

report:
  output_dir: reports

  # 日总结每天在这个时刻自动生成（机器当时关着的话，下次启动补齐）。
  # 小时报告不自动分析 —— 那是每小时一次模型调用，而绝大多数小时
  # 根本不会有人去看。要看哪个小时，在看板上点它。
  # 周报和月报同样只在点击时生成。
  daily_summary_at: "23:50"
  # 报告是被模型浓缩过的内容，信息密度比单张截图高得多，
  # 从隐私角度建议设个上限（比如 90）。
  #
  # 默认 0（永久保留）是刻意的：保留期一旦打开就立刻对既有数据生效，
  # 而删除不可逆。开发时把默认设成 90，重启服务的瞬间就删掉了
  # 5 月的 7 份报告 —— 这种事不该在别人升级时无声发生。
  # 要开就自己改，改之前先想清楚现有报告哪些不能丢。
  retention_days: 0

rag:
  enabled: true
  db_path: chroma_db
  # claude 后端没有 embedding 接口，走 chromadb 自带的本地模型 ——
  # 免费、离线，而且直接少掉一条出网路径。
  # 代价：它以英文训练为主，中文区分度偏弱（实测相关 0.58 / 无关 0.52），
  # 精确检索请用 search_screen，那是 grep 原文，不依赖向量。
  embedding_model: embedding-3
  top_k: 20
  max_chars_per_chunk: 300
