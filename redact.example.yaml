# 脱敏术语表模板。
#
# 用法：复制成 redact.local.yaml 再填自己的内容。
#   cp redact.example.yaml redact.local.yaml
#
# redact.local.yaml 已在 .gitignore 里 —— 真实同事姓名和公司名
# 不该进版本库，那正是这套机制要防的事。
#
# 每个键是一类，值是该类下的词。发给模型前替换成【类名+序号】，
# 收到回答后换回来。带序号是为了让模型仍能分辨「谁对谁说」。
#
# 长的词会先被替换，所以「某某科技有限公司」不会被「某某」切成两半，
# 全称和简称可以同时写。

人名:
  - 张三
  - 李四

公司:
  - 某某科技有限公司
  - 某某

项目:
  - 内部项目代号

# 邮箱、手机号、长串数字由代码自动识别并抹掉，不用写在这里，
# 它们也不会被还原 —— 对「我那天在做什么」没有信息量。
