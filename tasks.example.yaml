# 任务与工作性质。复制成 tasks.local.yaml 再填自己的。
#   cp tasks.example.yaml tasks.local.yaml
#
# tasks.local.yaml 已在 .gitignore 里 —— 里面是真实项目名。
#
# 候选可以让程序从窗口标题里挖：
#   venv/bin/python tasks.py

# ── 任务：这段时间在做哪个项目 ───────────────────────────
#
# 键是你想在报告里看到的名字，值是能认出它的关键词。
# 匹配窗口标题和屏幕正文，标题优先 —— VS Code 的标题直接带仓库名，
# 是最强信号；正文里出现的别的项目名可能只是被顺带提到。
#
# 同一个项目的所有写法都列进去：仓库名、中文名、繁体、分支前缀、需求号。
# 漏一种写法，那部分时间就会掉进「未归类」。
tasks:
  香港订座系统:
    - club-dining-reservation
    - 订座
    - 訂位
    - reservation
    - feat-3559

  澳觅管理后台:
    - aomi-mono-admin
    - 管理系統
    - setUp.vue

# ── 工作性质：这段时间在做哪类事 ─────────────────────────
#
# 按应用归类。这份映射通用，代码里已有默认值（编码/沟通/阅读/写作/设计），
# 只在需要覆盖或补充时才写。键是类别名，值是应用名的匹配片段。
# kinds:
#   会议:
#     - zoom
#     - 腾讯会议
